name: Build

on:
  push:
    branches: [cmp, main]
  pull_request:
    branches: [cmp, main]
  workflow_dispatch:

jobs:
  build:
    name: Library + samples
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build library (all targets)
        run: ./gradlew :pagecurl:assemble
      - name: Build Android sample
        run: ./gradlew :sample:androidApp:assembleDebug
      - name: Compile iOS sample framework
        run: ./gradlew :sample:shared:compileKotlinIosSimulatorArm64
