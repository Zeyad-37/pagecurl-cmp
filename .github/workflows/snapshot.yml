name: Publish Snapshot

on:
  push:
    branches: [cmp]
  workflow_dispatch:

concurrency:
  group: snapshot
  cancel-in-progress: true

jobs:
  snapshot:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Compute snapshot version (next patch)
        run: |
          BASE=$(grep '^VERSION_NAME=' gradle.properties | cut -d= -f2)
          NEXT=$(echo "$BASE" | awk -F. '{printf "%d.%d.%d", $1, $2, $3 + 1}')
          echo "SNAPSHOT_VERSION=${NEXT}-SNAPSHOT" >> "$GITHUB_ENV"
          echo "Publishing ${NEXT}-SNAPSHOT (base ${BASE})"
      - name: Publish snapshot to Central Portal snapshots
        run: ./gradlew :pagecurl:publishToMavenCentral --no-configuration-cache -PVERSION_NAME="$SNAPSHOT_VERSION"
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.SIGNING_KEY_ID }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}
